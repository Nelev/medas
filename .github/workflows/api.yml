name: api

on:
  push:
    branches: [main]
    paths:
      - "medas-api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "medas-api/**"
      - ".github/workflows/api.yml"

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, format, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medas-api

    steps:
      - uses: actions/checkout@v7

      # Pinned exactly: setup-uv publishes no floating major tag above v7,
      # so @v10 does not resolve even though v10.1.0 is the latest release.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: medas-api/uv.lock

      # Reads medas-api/.python-version (3.14). uv downloads the interpreter
      # rather than relying on whatever ubuntu-latest ships.
      - name: Install Python
        run: uv python install

      # --locked fails if uv.lock does not match pyproject.toml, so a
      # dependency added without relocking is caught here rather than
      # silently resolving to something different from local.
      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # No .env and no database: the suite is unit-only by design. Anything
      # needing a live Postgres belongs in a separate integration job.
      - name: Test
        run: uv run pytest -q
