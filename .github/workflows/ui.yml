name: ui

on:
  push:
    branches: [main]
    paths:
      - "medas-ui/**"
      - ".github/workflows/ui.yml"
  pull_request:
    paths:
      - "medas-ui/**"
      - ".github/workflows/ui.yml"

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medas-ui

    steps:
      - uses: actions/checkout@v7

      # Before setup-node, not after: `cache: yarn` below asks yarn where its
      # cache lives, and without corepack that question reaches the Yarn 1 the
      # runner ships rather than the Yarn 4 pinned in package.json.
      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: medas-ui/yarn.lock

      # --immutable fails if yarn.lock does not match package.json, so a
      # dependency added without committing the lockfile is caught here
      # rather than silently resolving to something different from local.
      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      # The pre-commit hook formats on the way in; this is what catches a
      # commit made with the hook not installed.
      - name: Check formatting
        run: yarn format:check

      # LayoutProps and friends are generated, not hand-written, and live
      # under .next -- which a fresh checkout does not have. Without this the
      # typecheck below fails on app/layout.tsx alone.
      - name: Generate route types
        run: yarn next typegen

      # tsc separately from next build: it reports every type error, while a
      # build stops at the first failing module.
      - name: Typecheck
        run: yarn tsc --noEmit

      # No API and no browser: the suite is unit-only by design. Anything
      # needing a running backend belongs in a separate E2E job.
      - name: Test
        run: yarn test

      # next build prerenders /, which fetches the greeting from medas-api at
      # build time. There is no API here, so without this the build dies with
      # ECONNREFUSED. The stub answers that one request and nothing else.
      #
      # This makes the build pass; it does not make the artefact deployable.
      # Anything published from this run would carry the stub's greeting, so
      # a real deploy needs a real API or a page that renders per request.
      - name: Start stub API
        run: |
          node scripts/stub-api.mjs &
          for _ in $(seq 1 20); do
            curl -sf http://localhost:8000/ > /dev/null && exit 0
            sleep 0.25
          done
          echo "stub api did not come up" >&2
          exit 1

      - name: Build
        env:
          API_BASE_URL: http://localhost:8000
        run: yarn build
