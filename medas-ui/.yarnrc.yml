approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

# Do NOT set npmMinimalAgeGate to 0. Yarn's default (1440 minutes) quarantines
# package versions published in the last 24 hours, which is the main defence
# against a compromised release being pulled in before anyone notices. The
# shadcn CLI disabled it to force an install through; the override is removed.
