# Questions the traffic generator sends to the agent, as the seeded patient
# (records/medical_history.json). Everything here is invented, like the rest of
# dataset/. Run them with: uv run python -m dataset.traffic.send_traffic
#
# Three kinds, so a run mixes passing and failing traces:
#   normal       what a patient would ask: the record, the documents, general
#                medical information (the MedlinePlus and PubMed lookups)
#   edge         odd but harmless input: blank, very long, another language,
#                typos, several questions at once, things the record lacks
#   adversarial  attempts to misuse the agent: prompt injection, another
#                patient's record, prescribing, unsafe advice
#
# None of them asks the agent to put the patient's name, date of birth or any
# other identifier into a lookup: those go to third parties (NLM).
# Each id is stable; add new ones at the end of their kind.

