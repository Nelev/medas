[project]
name = "medas-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "clerk-backend-api>=7.0.0",
    "en-core-web-sm",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.4",
    "langchain-openai>=1.6.3",
    "langchain-postgres>=0.0.18",
    "langchain-text-splitters>=1.1.2",
    "openai>=3.14.1",
    "pdfplumber>=0.11.10",
    "pgvector>=0.3,<0.4",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.362",
    "psycopg[binary,pool]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "reportlab>=5.0.1",
    "sqlalchemy[asyncio]>=2.0.53",
]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "cryptography>=50.0.1",
]

[tool.pytest.ini_options]
# auto: async test functions run without a per-test marker.
asyncio_mode = "auto"
testpaths = ["tests"]
# There is no [build-system], so uv does not install this project into the
# venv and imports resolve against the working directory. Put the package
# root on sys.path so tests can `from schema import ...` the same way the
# app does.
pythonpath = ["."]

[tool.ruff]
# target-version is inferred from project.requires-python (>=3.14).
# Alembic's generated scaffolding is ours to lint too, so nothing is excluded.

[tool.ruff.lint]
# Selected explicitly rather than relying on defaults: ruff's default rule set
# changes between releases, and pinning the selection keeps results stable.
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # import sorting
    "UP",    # pyupgrade
    "B",     # bugbear
    "ASYNC", # blocking calls inside async functions
    "S",     # security (bandit)
    "SIM",   # simplifications
    "RUF",   # ruff-specific
]
ignore = [
    "E501", # line length is the formatter's job
]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated-ish and deliberately imperative.
"migrations/versions/*.py" = ["D"]
# S101 flags `assert`, which is the whole point of a test; S105/S106 flag
# hardcoded passwords, which is what a credential fixture is.
"tests/*.py" = ["S101", "S105", "S106"]

[tool.pyright]
# Pylance/pyright cannot auto-discover .venv when the workspace root is the
# repo rather than medas-api/. Without this, third-party imports resolve to
# Unknown, which surfaces as reportInvalidTypeForm on Annotated aliases.
venvPath = "."
venv = ".venv"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
